name: Generate Git Koi

on:
  schedule:
    - cron: '0 0 * * *' # Updates every night at midnight UTC
  workflow_dispatch:    # Lets you trigger it manually anytime

permissions:
  contents: write

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Koi
        uses: yalongwastaken/git-koi@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push Koi GIF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add koi.gif
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update koi" && git push)
